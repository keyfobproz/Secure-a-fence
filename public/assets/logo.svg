<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 90" width="450" height="90">
  <defs>
    <pattern id="logoMesh" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 0 4 L 4 0 L 8 4 L 4 8 Z" fill="none" stroke="#94a3b8" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Fence Panel Icon on Left -->
  <g transform="translate(10, 15)">
    <!-- Base Left -->
    <polygon points="2,60 18,55 24,62 8,67" fill="#64748b"/>
    <!-- Base Right -->
    <polygon points="50,60 66,55 72,62 56,67" fill="#64748b"/>
    <!-- Mesh Quad 1 & 2 -->
    <rect x="12" y="15" width="25" height="20" fill="url(#logoMesh)"/>
    <rect x="37" y="15" width="25" height="20" fill="url(#logoMesh)"/>
    <!-- Mesh Quad 3 & 4 -->
    <rect x="12" y="35" width="25" height="20" fill="url(#logoMesh)"/>
    <rect x="37" y="35" width="25" height="20" fill="url(#logoMesh)"/>
    <!-- Frame Rails & Posts -->
    <rect x="10" y="12" width="54" height="4" rx="1" fill="#334155"/>
    <rect x="10" y="53" width="54" height="4" rx="1" fill="#334155"/>
    <rect x="8" y="8" width="5" height="49" rx="1" fill="#334155"/>
    <rect x="61" y="8" width="5" height="49" rx="1" fill="#334155"/>
    <rect x="34" y="12" width="4" height="45" fill="#334155"/>
    <rect x="10" y="33" width="54" height="4" fill="#334155"/>
  </g>

  <!-- SECURE-A-FENCE Typography -->
  <text x="92" y="42" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-weight="900" font-size="28" fill="#f8fafc" letter-spacing="1">SECURE<tspan fill="#3b82f6">-A-</tspan>FENCE</text>
  
  <!-- Underline Divider -->
  <line x1="92" y1="52" x2="430" y2="52" stroke="#3b82f6" stroke-width="2.5"/>

  <!-- TEMPORARY FENCING SOLUTIONS Subtitle -->
  <text x="92" y="70" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-weight="600" font-size="11" fill="#94a3b8" letter-spacing="3.5">TEMPORARY FENCING SOLUTIONS</text>
</svg>
