<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="fencePattern" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Shield Icon -->
  <g transform="translate(10, 10)">
    <path d="M 30 5 L 55 15 C 55 45 30 58 30 58 C 30 58 5 45 5 15 Z" fill="url(#shieldGrad)" stroke="#60a5fa" stroke-width="2"/>
    <!-- Embedded Fence Grate inside Shield -->
    <path d="M 18 20 L 42 20 M 18 28 L 42 28 M 18 36 L 42 36 M 22 15 L 22 42 M 30 15 L 30 42 M 38 15 L 38 42" stroke="url(#fencePattern)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Brand Typography -->
  <text x="75" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="#ffffff" letter-spacing="0.5">SECURE<tspan fill="#f59e0b">-A-</tspan>FENCE</text>
  <text x="76" y="56" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#94a3b8" letter-spacing="1.5">SALES &amp; RENTALS</text>
</svg>
