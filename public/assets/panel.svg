<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Ultra-realistic Galvanized Steel Shading -->
    <linearGradient id="galvSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="80%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="tubeHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="sunGleam" cx="20%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="chainlinkMesh" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 0 8 L 8 0 L 16 8 L 8 16 Z" fill="none" stroke="#cbd5e1" stroke-width="1.3" opacity="0.9"/>
      <circle cx="8" cy="8" r="0.7" fill="#f8fafc"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#sunGleam)"/>
  <rect width="800" height="500" fill="#0f172a" style="mix-blend-mode: behind;"/>

  <!-- Panel Structure Group -->
  <g transform="translate(60, 45)">
    <!-- Drop Shadow beneath panel -->
    <ellipse cx="360" cy="435" rx="310" ry="25" fill="#020617" opacity="0.75" filter="blur(8px)"/>

    <!-- Left Rectangular Tubular Ground Base -->
    <polygon points="15,400 95,380 125,410 45,430" fill="none" stroke="url(#galvSteel)" stroke-width="10" stroke-linejoin="round"/>
    <polygon points="15,400 95,380 125,410 45,430" fill="#1e293b" opacity="0.6"/>
    <!-- Insert Upright Pipe Receiver -->
    <rect x="80" y="335" width="9" height="55" rx="2" fill="url(#galvSteel)" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Right Rectangular Tubular Ground Base -->
    <polygon points="555,420 635,400 665,430 585,450" fill="none" stroke="url(#galvSteel)" stroke-width="10" stroke-linejoin="round"/>
    <polygon points="555,420 635,400 665,430 585,450" fill="#1e293b" opacity="0.6"/>
    <!-- Insert Upright Pipe Receiver -->
    <rect x="620" y="355" width="9" height="55" rx="2" fill="url(#galvSteel)" stroke="#0f172a" stroke-width="1.5"/>

    <!-- 4-Quadrant Chain Link Mesh Panels -->
    <rect x="82" y="65" width="265" height="135" fill="url(#chainlinkMesh)"/>
    <rect x="357" y="65" width="265" height="135" fill="url(#chainlinkMesh)"/>
    <rect x="82" y="210" width="265" height="135" fill="url(#chainlinkMesh)"/>
    <rect x="357" y="210" width="265" height="135" fill="url(#chainlinkMesh)"/>

    <!-- Outer Frame Top Rail -->
    <rect x="78" y="60" width="548" height="9" rx="3" fill="url(#galvSteel)" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Outer Frame Bottom Rail -->
    <rect x="78" y="342" width="548" height="9" rx="3" fill="url(#galvSteel)" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Left Upright Post (extending above top rail) -->
    <rect x="76" y="38" width="9" height="340" rx="3" fill="url(#galvSteel)" stroke="#0f172a" stroke-width="1.5"/>
    <ellipse cx="80" cy="39" rx="4.5" ry="2" fill="#f8fafc"/>

    <!-- Right Upright Post (extending above top rail) -->
    <rect x="619" y="10" width="9" height="368" rx="3" fill="url(#galvSteel)" stroke="#0f172a" stroke-width="1.5"/>
    <ellipse cx="623" cy="11" rx="4.5" ry="2" fill="#f8fafc"/>

    <!-- Center Horizontal Divider Bar -->
    <rect x="78" y="200" width="548" height="9" rx="3" fill="url(#galvSteel)" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Center Vertical Divider Bar -->
    <rect x="348" y="60" width="9" height="290" rx="3" fill="url(#galvSteel)" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Welded Joint Plates -->
    <rect x="345" y="197" width="15" height="15" rx="3" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>

    <!-- Refurbished Badge -->
    <g transform="translate(460, 290)">
      <rect width="140" height="34" rx="6" fill="#f59e0b" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.5))"/>
      <text x="70" y="22" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="12" fill="#0f172a" text-anchor="middle">REFURBISHED 6x12</text>
    </g>
  </g>
</svg>
