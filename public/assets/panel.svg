<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <defs>
    <!-- Realistic Galvanized Shading -->
    <linearGradient id="galvPipe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#cbd5e1"/>
      <stop offset="60%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="groundShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </linearGradient>
    <pattern id="chainMesh" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M 0 7 L 7 0 L 14 7 L 7 14 Z" fill="none" stroke="#cbd5e1" stroke-width="1.2" opacity="0.95"/>
      <circle cx="7" cy="7" r="0.6" fill="#f8fafc"/>
    </pattern>
  </defs>

  <!-- Asphalt Ground / Background Context matching Image #1 & #2 -->
  <rect width="900" height="550" fill="#1e293b"/>
  <!-- Ground asphalt strip at bottom -->
  <path d="M 0 420 L 900 420 L 900 550 L 0 550 Z" fill="#0f172a"/>
  <!-- Wall backdrop -->
  <path d="M 0 0 L 900 0 L 900 420 L 0 420 Z" fill="#334155" opacity="0.4"/>

  <!-- FENCE GROUP -->
  <g transform="translate(60, 30)">
    <!-- Ground Shadow matching photo -->
    <ellipse cx="400" cy="410" rx="340" ry="20" fill="url(#groundShadow)" filter="blur(6px)"/>

    <!-- Left Rectangular Tubular Base Stand -->
    <polygon points="20,380 90,365 115,395 45,410" fill="none" stroke="url(#galvPipe)" stroke-width="9" stroke-linejoin="round"/>
    <polygon points="20,380 90,365 115,395 45,410" fill="#0f172a" opacity="0.5"/>
    <rect x="75" y="325" width="8" height="50" rx="2" fill="url(#galvPipe)" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Right Rectangular Tubular Base Stand -->
    <polygon points="695,395 765,380 790,410 720,425" fill="none" stroke="url(#galvPipe)" stroke-width="9" stroke-linejoin="round"/>
    <polygon points="695,395 765,380 790,410 720,425" fill="#0f172a" opacity="0.5"/>
    <rect x="755" y="340" width="8" height="50" rx="2" fill="url(#galvPipe)" stroke="#0f172a" stroke-width="1.5"/>

    <!-- 4 Quadrants Chain Link Mesh -->
    <rect x="80" y="50" width="345" height="145" fill="url(#chainMesh)"/>
    <rect x="430" y="50" width="345" height="145" fill="url(#chainMesh)"/>
    <rect x="80" y="200" width="345" height="145" fill="url(#chainMesh)"/>
    <rect x="430" y="200" width="345" height="145" fill="url(#chainMesh)"/>

    <!-- Top & Bottom Rails -->
    <rect x="76" y="45" width="702" height="8" rx="2" fill="url(#galvPipe)" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="76" y="340" width="702" height="8" rx="2" fill="url(#galvPipe)" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Left Post -->
    <rect x="74" y="25" width="8" height="325" rx="2" fill="url(#galvPipe)" stroke="#0f172a" stroke-width="1.5"/>
    <ellipse cx="78" cy="26" rx="4" ry="2" fill="#f8fafc"/>

    <!-- Right Post -->
    <rect x="774" y="10" width="8" height="345" rx="2" fill="url(#galvPipe)" stroke="#0f172a" stroke-width="1.5"/>
    <ellipse cx="778" cy="11" rx="4" ry="2" fill="#f8fafc"/>

    <!-- Center Crossbars -->
    <rect x="76" y="194" width="702" height="8" rx="2" fill="url(#galvPipe)" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="424" y="45" width="8" height="300" rx="2" fill="url(#galvPipe)" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Joint Plate -->
    <rect x="421" y="191" width="14" height="14" rx="2" fill="#cbd5e1" stroke="#334155" stroke-width="1"/>

    <!-- Badge -->
    <g transform="translate(560, 275)">
      <rect width="160" height="36" rx="6" fill="#f59e0b" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.5))"/>
      <text x="80" y="23" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="13" fill="#0f172a" text-anchor="middle">6' x 12' JOB-READY</text>
    </g>
  </g>
</svg>
