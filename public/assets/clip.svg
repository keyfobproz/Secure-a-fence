<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="galv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Safety Panel Clamp Clip -->
  <g transform="translate(150, 70)">
    <!-- Clamp Jaw Left -->
    <path d="M 60 100 C 30 100 30 180 60 180 L 120 180 L 120 100 Z" fill="url(#galv)" stroke="#1e293b" stroke-width="4"/>
    
    <!-- Clamp Jaw Right -->
    <path d="M 240 100 C 270 100 270 180 240 180 L 180 180 L 180 100 Z" fill="url(#galv)" stroke="#1e293b" stroke-width="4"/>

    <!-- Center Carriage Bolt -->
    <rect x="110" y="125" width="80" height="30" rx="3" fill="#334155"/>
    <polygon points="190,120 210,140 190,160" fill="#f59e0b"/>
    
    <!-- Lock Nut -->
    <polygon points="205,125 220,125 225,140 220,155 205,155 200,140" fill="url(#galv)" stroke="#0f172a"/>

    <!-- Spec Badge -->
    <g transform="translate(50, 220)">
      <rect width="200" height="32" rx="6" fill="#10b981"/>
      <text x="100" y="21" font-family="sans-serif" font-weight="bold" font-size="13" fill="#ffffff" text-anchor="middle">HEAVY-DUTY PANEL COUPLER</text>
    </g>
  </g>
</svg>
