<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="galvMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="80%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bgCanvas)"/>

  <!-- Press-formed Double-Barrel Coupler Clamp (Matching photo) -->
  <g transform="translate(100, 50)">
    <!-- Main Double-Barrel Body Shell -->
    <path d="M 50 80 C 20 80 10 130 30 160 C 50 190 90 180 120 160 L 140 180 C 170 200 210 190 230 160 C 250 130 240 80 210 80 C 180 80 160 110 130 110 C 100 110 80 80 50 80 Z" fill="url(#galvMetal)" stroke="#1e293b" stroke-width="4"/>

    <!-- Left Tube Channel Hollow Opening -->
    <ellipse cx="75" cy="135" rx="32" ry="38" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <!-- Right Tube Channel Hollow Opening -->
    <ellipse cx="185" cy="135" rx="32" ry="38" fill="#1e293b" stroke="#64748b" stroke-width="2"/>

    <!-- Center Bridge with Square Bolt Holes (Matching photo) -->
    <rect x="117" y="105" width="26" height="26" rx="3" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <rect x="117" y="145" width="26" height="26" rx="3" fill="#334155" stroke="#94a3b8" stroke-width="2"/>

    <!-- Carriage Bolt & Hex Nut (Matching photo layout) -->
    <!-- Hex Nut on Left -->
    <g transform="translate(60, 240)">
      <polygon points="15,0 35,5 40,25 25,40 5,35 0,15" fill="url(#boltGrad)" stroke="#94a3b8" stroke-width="2"/>
      <circle cx="20" cy="20" r="8" fill="#0f172a"/>
    </g>

    <!-- Threaded Carriage Bolt -->
    <g transform="translate(120, 240)">
      <!-- Threaded Shaft -->
      <rect x="0" y="12" width="160" height="16" rx="2" fill="url(#boltGrad)" stroke="#64748b" stroke-width="1.5"/>
      <!-- Bolt Threads pattern -->
      <line x1="20" y1="12" x2="20" y2="28" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="40" y1="12" x2="40" y2="28" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="60" y1="12" x2="60" y2="28" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="80" y1="12" x2="80" y2="28" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="100" y1="12" x2="100" y2="28" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="120" y1="12" x2="120" y2="28" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="140" y1="12" x2="140" y2="28" stroke="#cbd5e1" stroke-width="2"/>
      
      <!-- Rounded Dome Head -->
      <path d="M 160 5 C 175 5 185 12 185 20 C 185 28 175 35 160 35 Z" fill="url(#boltGrad)" stroke="#94a3b8" stroke-width="2"/>
    </g>

    <!-- Badge -->
    <g transform="translate(65, 320)">
      <rect width="190" height="30" rx="6" fill="#10b981"/>
      <text x="95" y="20" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">SAFETY COUPLER CLAMP</text>
    </g>
  </g>
</svg>
