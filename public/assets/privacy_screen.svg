<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Privacy Screen Roll -->
  <g transform="translate(100, 60)">
    <rect x="40" y="40" width="320" height="220" rx="6" fill="url(#screen)" stroke="#10b981" stroke-width="4"/>
    
    <!-- Grommet detail circles -->
    <circle cx="60" cy="55" r="5" fill="#f59e0b"/>
    <circle cx="140" cy="55" r="5" fill="#f59e0b"/>
    <circle cx="220" cy="55" r="5" fill="#f59e0b"/>
    <circle cx="300" cy="55" r="5" fill="#f59e0b"/>
    <circle cx="340" cy="55" r="5" fill="#f59e0b"/>

    <circle cx="60" cy="245" r="5" fill="#f59e0b"/>
    <circle cx="140" cy="245" r="5" fill="#f59e0b"/>
    <circle cx="220" cy="245" r="5" fill="#f59e0b"/>
    <circle cx="300" cy="245" r="5" fill="#f59e0b"/>
    <circle cx="340" cy="245" r="5" fill="#f59e0b"/>

    <!-- Roll effect on side -->
    <ellipse cx="360" cy="150" rx="20" ry="110" fill="#064e3b" stroke="#10b981" stroke-width="3"/>

    <!-- Text badge -->
    <g transform="translate(100, 280)">
      <rect width="200" height="32" rx="6" fill="#059669"/>
      <text x="100" y="21" font-family="sans-serif" font-weight="bold" font-size="13" fill="#ffffff" text-anchor="middle">88% BLOCKAGE PRIVACY SCREEN</text>
    </g>
  </g>
</svg>
