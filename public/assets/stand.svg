<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Fence Panel Heavy Duty Stand -->
  <g transform="translate(100, 80)">
    <!-- Flat Heavy Steel Base -->
    <rect x="50" y="200" width="300" height="24" rx="4" fill="url(#steel)" stroke="#0f172a" stroke-width="3"/>
    
    <!-- Vertical Pipe Receivers -->
    <rect x="110" y="80" width="36" height="120" rx="4" fill="url(#steel)" stroke="#0f172a" stroke-width="3"/>
    <rect x="254" y="80" width="36" height="120" rx="4" fill="url(#steel)" stroke="#0f172a" stroke-width="3"/>

    <!-- Hole Openings for Fence Uprights -->
    <ellipse cx="128" cy="85" rx="14" ry="6" fill="#1e293b"/>
    <ellipse cx="272" cy="85" rx="14" ry="6" fill="#1e293b"/>

    <!-- Ground Anchor Bolt Holes -->
    <circle cx="80" cy="212" r="6" fill="#0f172a"/>
    <circle cx="320" cy="212" r="6" fill="#0f172a"/>

    <!-- Dimension Label Badge -->
    <g transform="translate(100, 240)">
      <rect width="200" height="30" rx="6" fill="#3b82f6"/>
      <text x="100" y="20" font-family="sans-serif" font-weight="bold" font-size="13" fill="#ffffff" text-anchor="middle">36" x 16" GALVANIZED BASE</text>
    </g>
  </g>
</svg>
