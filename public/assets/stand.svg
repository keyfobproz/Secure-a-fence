<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <linearGradient id="galvMetalStand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="standGleam" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </radialGradient>
  </defs>

  <rect width="700" height="450" fill="url(#standGleam)"/>

  <!-- Single Stand (Matching User's Photo #1) -->
  <g transform="translate(80, 50)">
    <!-- Base shadow -->
    <ellipse cx="270" cy="320" rx="200" ry="22" fill="#020617" opacity="0.6" filter="blur(6px)"/>

    <!-- Outer Rectangular Tubular Frame -->
    <polygon points="70,220 380,130 430,280 120,370" fill="none" stroke="url(#galvMetalStand)" stroke-width="15" stroke-linejoin="round"/>
    
    <!-- Center Support Bar -->
    <line x1="225" y1="175" x2="275" y2="325" stroke="url(#galvMetalStand)" stroke-width="13" stroke-linecap="round"/>

    <!-- Dual Vertical Upright Tubes Welded in Center -->
    <rect x="245" y="60" width="11" height="125" rx="3" fill="url(#galvMetalStand)" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="264" y="66" width="11" height="125" rx="3" fill="url(#galvMetalStand)" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Open Pipe Tops -->
    <ellipse cx="250" cy="60" rx="5.5" ry="2.5" fill="#1e293b"/>
    <ellipse cx="269" cy="66" rx="5.5" ry="2.5" fill="#1e293b"/>

    <!-- Subject to change notice badge -->
    <g transform="translate(100, 385)">
      <rect width="340" height="34" rx="6" fill="#f59e0b" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.5))"/>
      <text x="170" y="22" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="12" fill="#0f172a" text-anchor="middle">HEAVY-DUTY BASE STAND (STZ. SUBJECT TO CHANGE)</text>
    </g>
  </g>
</svg>
