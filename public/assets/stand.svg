<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bgCanvas)"/>

  <!-- Tubular Stand (Matching exact photo style) -->
  <g transform="translate(80, 70)">
    <!-- Outer Rectangular Tubular Base Frame -->
    <polygon points="60,180 340,110 380,240 100,310" fill="none" stroke="url(#metalGrad)" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="60,180 340,110 380,240 100,310" fill="#1e293b" opacity="0.35"/>

    <!-- Center Crossbar -->
    <line x1="200" y1="145" x2="260" y2="275" stroke="url(#metalGrad)" stroke-width="12" stroke-linecap="round"/>

    <!-- Two Vertical Upright Insertion Pins Welded in Center -->
    <rect x="220" y="50" width="10" height="110" rx="3" fill="url(#metalGrad)" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="238" y="55" width="10" height="110" rx="3" fill="url(#metalGrad)" stroke="#0f172a" stroke-width="1.5"/>
    
    <!-- Open Pipe Holes at top of pins -->
    <ellipse cx="225" cy="50" rx="5" ry="2.5" fill="#1e293b"/>
    <ellipse cx="243" cy="55" rx="5" ry="2.5" fill="#1e293b"/>

    <!-- Badge -->
    <g transform="translate(100, 330)">
      <rect width="220" height="30" rx="6" fill="#3b82f6"/>
      <text x="110" y="20" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">TUBULAR STEEL BASE STAND</text>
    </g>
  </g>
</svg>
